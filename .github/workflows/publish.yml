name: Publish weekly devotional

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blog/posts.json'
      - 'blog/*.html'
      - 'build_blog.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild archive and RSS feed
        run: python build_blog.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain blog/index.html feed.xml)" ]; then
            git add blog/index.html feed.xml
            git commit -m "Publish scheduled devotional (automated)"
            git push
          else
            echo "No changes to publish."
          fi
